[project]
name = "spendings-backend"
version = "0.1.0"
description = "Personal finance backend: document import, transaction extraction, categorization, dashboards"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "anthropic>=1.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
